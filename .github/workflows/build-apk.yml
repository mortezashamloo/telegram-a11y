name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Clone Telegram with submodules
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/DrKLO/Telegram.git telegram
          cd telegram
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ] && [ ! -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            echo "jlatexmath missing - cloning explicitly"
            rm -rf TMessagesProj/lib/jlatexmath
            git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Inject API credentials
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "ERROR: Set secrets TELEGRAM_API_ID and TELEGRAM_API_HASH"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          t = p.read_text(encoding="utf-8")
          api_id = os.environ["API_ID"].strip()
          api_hash = os.environ["API_HASH"].strip()
          t2, n1 = re.subn(r"(APP_ID\s*=\s*)[^;\n]+", r"\g<1>" + api_id, t, count=1)
          t2, n2 = re.subn(r'(APP_HASH\s*=\s*)"[^"]*"', r'\g<1>"' + api_hash + '"', t2, count=1)
          if n1 < 1 or n2 < 1:
              raise SystemExit(f"Could not patch BuildVars (id={n1}, hash={n2})")
          p.write_text(t2, encoding="utf-8")
          print("BuildVars patched OK")
          PY

      - name: Wire jlatexmath module
        run: |
          set -e
          cd telegram
          if [ -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            JDIR="TMessagesProj/lib/jlatexmath/jlatexmath"
          elif [ -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            JDIR="TMessagesProj/lib/jlatexmath"
          else
            echo "ERROR: cannot locate jlatexmath build.gradle"
            find TMessagesProj/lib -type f -name "build.gradle" | head -20 || true
            exit 1
          fi
          echo "jlatexmath dir: $JDIR"
          if ! grep -q "include ':jlatexmath'" settings.gradle; then
            printf "\ninclude ':jlatexmath'\nproject(':jlatexmath').projectDir = new File(rootDir, '%s')\n" "$JDIR" >> settings.gradle
          fi

      - name: Apply a11y patches
        run: |
          set -e
          PDIR="patches-repo/patches"
          if [ -d "$PDIR" ]; then
            shopt -s nullglob
            for f in "$PDIR"/*.patch; do
              echo "Applying $f"
              git -C telegram apply --whitespace=nowarn "$PWD/$f" || git -C telegram apply -3 "$PWD/$f" || true
            done
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("telegram/TMessagesProj/src/main/res")
          for rel in ["values/strings.xml"]:
              p = root / rel
              if not p.exists():
                  continue
              t = p.read_text(encoding="utf-8")
              t2, n = re.subn(
                  r'(<string\s+name="AppName">)[^<]*(</string>)',
                  r"\1Telegram Accessible\2",
                  t,
                  count=1,
              )
              if n:
                  p.write_text(t2, encoding="utf-8")
                  print(f"AppName EN patched in {rel}")
              else:
                  print(f"WARN: AppName not found in {rel}")
          for rel in ["values-fa/strings.xml", "values-fa-rIR/strings.xml"]:
              p = root / rel
              if not p.exists():
                  if rel == "values-fa/strings.xml":
                      p.parent.mkdir(parents=True, exist_ok=True)
                      p.write_text(
                          '<?xml version="1.0" encoding="utf-8"?>\n'
                          '<resources>\n'
                          '    <string name="AppName">تلگرام دسترس‌پذیر</string>\n'
                          '</resources>\n',
                          encoding="utf-8",
                      )
                      print(f"Created {rel} with Persian AppName")
                  continue
              t = p.read_text(encoding="utf-8")
              if 'name="AppName"' in t:
                  t2, n = re.subn(
                      r'(<string\s+name="AppName">)[^<]*(</string>)',
                      r"\1تلگرام دسترس‌پذیر\2",
                      t,
                      count=1,
                  )
                  p.write_text(t2, encoding="utf-8")
                  print(f"AppName FA patched in {rel} (n={n})")
              else:
                  t2 = t.replace("</resources>", '    <string name="AppName">تلگرام دسترس‌پذیر</string>\n</resources>')
                  p.write_text(t2, encoding="utf-8")
                  print(f"AppName FA inserted in {rel}")
          PY

          SMH="telegram/TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java"
          CA="telegram/TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java"
          if [ -f "$SMH" ] && ! grep -q "IS_FORWARD_NO_QUOTE" "$SMH"; then
            sed -i 's/req\.drop_author = forwardFromMyName;/req.drop_author = forwardFromMyName || org.telegram.ui.ChatActivity.IS_FORWARD_NO_QUOTE; org.telegram.ui.ChatActivity.IS_FORWARD_NO_QUOTE = false;/' "$SMH" || true
            echo "SendMessagesHelper drop_author patched"
          fi
          if [ -f "$CA" ] && ! grep -q "IS_FORWARD_NO_QUOTE" "$CA"; then
            sed -i '0,/protected TLRPC.Chat currentChat;/s//public static boolean IS_FORWARD_NO_QUOTE = false;\n    protected TLRPC.Chat currentChat;/' "$CA" || true
            echo "ChatActivity IS_FORWARD_NO_QUOTE flag patched"
          fi

          CMC="telegram/TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
          if [ -f "$CMC" ] && grep -q "checkNeedDrawShareButton" "$CMC"; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("telegram/TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java")
          t = p.read_text(encoding="utf-8")
          if "a11y-fork: hide share" not in t:
              t2, n = re.subn(
                  r"(boolean\s+checkNeedDrawShareButton\s*\([^)]*\)\s*\{)",
                  r"\1\n        // a11y-fork: hide share button between messages\n        if (true) return false;",
                  t,
                  count=1,
              )
              if n:
                  p.write_text(t2, encoding="utf-8")
                  print("Hide share button patched")
              else:
                  print("WARN: checkNeedDrawShareButton not patched")
          else:
              print("Hide share already present")
          PY
          fi

          echo "A11y patch step done"

      # arm64 flavor only (not afat multi-ABI) → much smaller APK; most phones are arm64
      - name: Build arm64 debug APK
        working-directory: telegram
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleArm64Debug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find telegram -path "*outputs/apk*" -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-accessible-arm64-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
