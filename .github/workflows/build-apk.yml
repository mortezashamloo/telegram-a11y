name: Build APK

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: 'نوع Run'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v7
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Build
        run: |
          if [ "${{ github.event.inputs.run_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
