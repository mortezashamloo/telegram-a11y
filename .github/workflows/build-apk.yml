name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout this repo (patches + workflow)
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Clone Telegram sources (full submodules)
        run: |
          set -e
          git clone --recursive --depth 1 \
            https://github.com/DrKLO/Telegram.git telegram
          cd telegram
          # Ensure every submodule is present (shallow can leave empty dirs)
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 || \
            git submodule update --init --recursive
          # jlatexmath is required by TMessagesProj
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ] && [ ! -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            echo "jlatexmath missing — cloning explicitly"
            rm -rf TMessagesProj/lib/jlatexmath
            git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi
          echo "=== jlatexmath tree ==="
          find TMessagesProj/lib/jlatexmath -maxdepth 3 -type f -name "build.gradle" | head -20
          ls -la TMessagesProj/lib/jlatexmath || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform / build-tools / NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Inject API_ID / API_HASH into BuildVars
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "ERROR: Set secrets TELEGRAM_API_ID and TELEGRAM_API_HASH"
            exit 1
          fi
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          t = p.read_text(encoding="utf-8")
          api_id = os.environ["API_ID"].strip()
          api_hash = os.environ["API_HASH"].strip()
          t2, n1 = re.subn(r"(APP_ID\s*=\s*)[^;\n]+", r"\g<1>" + api_id, t, count=1)
          t2, n2 = re.subn(r'(APP_HASH\s*=\s*)"[^"]*"', r'\g<1>"' + api_hash + '"', t2, count=1)
          if n1 < 1 or n2 < 1:
              raise SystemExit(f"Could not patch BuildVars (id={n1}, hash={n2})")
          p.write_text(t2, encoding="utf-8")
          print("BuildVars patched OK")
          PY

      - name: Wire jlatexmath into settings.gradle
        run: |
          set -e
          cd telegram
          # Find actual module path inside the submodule
          if [ -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            JDIR="TMessagesProj/lib/jlatexmath/jlatexmath"
          elif [ -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            JDIR="TMessagesProj/lib/jlatexmath"
          else
            echo "ERROR: cannot locate jlatexmath build.gradle"
            find TMessagesProj/lib -type f -name "build.gradle" | head -20
            exit 1
          fi
          echo "jlatexmath module dir: $JDIR"
          # Append include if missing
          if ! grep -q "include ':jlatexmath'" settings.gradle; then
            cat >> settings.gradle <<EOF

include ':jlatexmath'
project(':jlatexmath').projectDir = new File(rootDir, '$JDIR')
EOF
            echo "Patched settings.gradle:"
            cat settings.gradle
          fi

      - name: Apply accessibility patches (if present)
        run: |
          set -e
          PDIR="patches-repo/patches"
          if [ -d "$PDIR" ]; then
            echo "Patches folder found — apply any *.patch files"
            shopt -s nullglob
            for f in "$PDIR"/*.patch; do
              echo "Applying $f"
              # apply from telegram root with absolute patch path
              git -C telegram apply --whitespace=nowarn "$PWD/$f" || \
                git -C telegram apply -3 "$PWD/$f" || true
            done
          fi

          SMH="telegram/TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java"
          CA="telegram/TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java"
          if [ -f "$SMH" ]; then
            if ! grep -q "IS_FORWARD_NO_QUOTE" "$SMH" 2>/dev/null; then
              sed -i 's/req\.drop_author = forwardFromMyName;/req.drop_author = forwardFromMyName || org.telegram.ui.ChatActivity.IS_FORWARD_NO_QUOTE; org.telegram.ui.ChatActivity.IS_FORWARD_NO_QUOTE = false;/' "$SMH" || true
              echo "Patched drop_author line in SendMessagesHelper (flag-aware)"
            fi
          fi
          if [ -f "$CA" ] && ! grep -q "IS_FORWARD_NO_QUOTE" "$CA" 2>/dev/null; then
            sed -i '0,/protected TLRPC.Chat currentChat;/s//public static boolean IS_FORWARD_NO_QUOTE = false;\n    protected TLRPC.Chat currentChat;/' "$CA" || true
            echo "Injected IS_FORWARD_NO_QUOTE into ChatActivity"
          fi

      - name: Make gradlew executable
        working-directory: telegram
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: telegram
        run: |
          # App module produces the installable APK (library module does not)
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Find APK
        id: apk
        run: |
          APK=$(find telegram -path "*outputs/apk*" -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-a11y-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
